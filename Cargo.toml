[package]
name = "neyrang"
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.98"
description = "NEYRANG, an independent UCI chess engine written in Rust"
license = "GPL-3.0-or-later"

[features]
default = ["nnue", "policy", "stockfish-nnue"]
nnue = []
policy = []
sanj-tools = []
stats = []
stockfish-nnue = ["nnue", "dep:nnue-rs"]

[dependencies]
nnue-rs = { version = "0.4.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.maxperf]
inherits = "release"
lto = "fat"

[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = true

[profile.test]
opt-level = 2
